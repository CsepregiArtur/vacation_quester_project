spring.application.name=demo

# ---------- SQLite datasource ----------
# Fisierul .db este creat automat de SQLite daca nu exista.
spring.datasource.url=jdbc:sqlite:./vacation_quester.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite nu are user/parola; le lasam goale ca Hikari sa nu trimita credentiale
spring.datasource.username=
spring.datasource.password=
# IMPORTANT: SQLite permite un singur scriitor, deci pool-ul se tine la 1
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=SqlitePool

# Ruleaza schema.sql la pornire (scriptul e idempotent - foloseste IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8
