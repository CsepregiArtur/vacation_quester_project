spring.application.name=demo

# ---------- SQLite ----------
spring.datasource.url=jdbc:sqlite:./vacation_quester.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.pool-name=SqlitePool
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8

# Mesajele de eroare (ex. "AI-ul nu este configurat...") ajung in raspunsul JSON
spring.web.error.include-message=always

# ---------- Gemini (text + minitest + validare foto) ----------
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
gemini.url=https://generativelanguage.googleapis.com

# ---------- Email (SMTP, optional) ----------
# Completeaza spring.mail.host/user/password pentru trimitere reala; altfel emailurile sunt doar logate.
app.mail.from=no-reply@vacationquester.local

# ---------- Poze pentru dovezi ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
